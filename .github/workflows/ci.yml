name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality:
    name: Python tests and lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: python -m pip install --upgrade pip ".[api,gui,dev]"

      - name: Lint
        run: ruff check .

      - name: Compile
        run: python -m compileall -q main.py src tests

      - name: Run tests
        run: python -m unittest discover -s tests -v

  manifests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate GitHub Actions workflow
        uses: docker://rhysd/actionlint:1.7.12

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.32.0

      - name: Render and validate every overlay
        shell: bash
        run: |
          set -euo pipefail
          for overlay in default huggingface modelscope ollama; do
            output="${RUNNER_TEMP}/${overlay}.yaml"
            kubectl kustomize "k8s/overlays/${overlay}" > "${output}"
          done
          docker run --rm \
            -v "${RUNNER_TEMP}:/manifests:ro" \
            ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict -summary \
            /manifests/default.yaml \
            /manifests/huggingface.yaml \
            /manifests/modelscope.yaml \
            /manifests/ollama.yaml

  container-check:
    name: Build container on pull request
    if: github.event_name == 'pull_request'
    needs:
      - quality
      - manifests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          build-args: SLM_KAG_EXTRAS=api,gui
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish container to GHCR
    if: github.event_name != 'pull_request'
    needs:
      - quality
      - manifests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: SLM_KAG_EXTRAS=all
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Attest image provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
