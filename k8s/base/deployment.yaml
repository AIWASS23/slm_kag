apiVersion: apps/v1
kind: Deployment
metadata:
  name: slm-kag
  labels:
    app.kubernetes.io/name: slm-kag
    app.kubernetes.io/part-of: slm-kag
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: slm-kag
      app.kubernetes.io/component: runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: slm-kag
        app.kubernetes.io/component: runtime
        app.kubernetes.io/part-of: slm-kag
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gui
          image: slm-kag:latest
          imagePullPolicy: IfNotPresent
          command:
            - streamlit
          args:
            - run
            - main.py
            - --server.address=0.0.0.0
            - --server.port=8501
          envFrom:
            - configMapRef:
                name: slm-kag-config
          ports:
            - name: gui
              containerPort: 8501
              protocol: TCP
          startupProbe:
            httpGet:
              path: /_stcore/health
              port: gui
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: gui
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: gui
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 6Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: model-cache
              mountPath: /app/models
            - name: gui-tmp
              mountPath: /tmp
        - name: api
          image: slm-kag:latest
          imagePullPolicy: IfNotPresent
          command:
            - slm-kag
          args:
            - serve
            - --host=0.0.0.0
            - --port=8000
          envFrom:
            - configMapRef:
                name: slm-kag-config
          ports:
            - name: api
              containerPort: 8000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: api
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: model-cache
              mountPath: /app/models
            - name: api-tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: slm-kag-data
        - name: model-cache
          persistentVolumeClaim:
            claimName: slm-kag-model-cache
        - name: gui-tmp
          emptyDir:
            sizeLimit: 2Gi
        - name: api-tmp
          emptyDir:
            sizeLimit: 2Gi

