apiVersion: v1
kind: Service
metadata:
  name: slm-kag-gui
  labels:
    app.kubernetes.io/name: slm-kag
    app.kubernetes.io/component: gui
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: slm-kag
    app.kubernetes.io/component: runtime
  ports:
    - name: http
      port: 80
      targetPort: gui
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: slm-kag-api
  labels:
    app.kubernetes.io/name: slm-kag
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: slm-kag
    app.kubernetes.io/component: runtime
  ports:
    - name: http
      port: 8000
      targetPort: api
      protocol: TCP

